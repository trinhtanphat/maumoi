name: Materialize canonical handoff source

on:
  push:
    branches: [feat/initial-mvp]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand and verify canonical source
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .handoff/assets.js.gz > src/web/assets.js
          gzip -dc .handoff/routes.js.gz > src/worker/routes.js
          test "$(git hash-object src/web/assets.js)" = "d113112923695e8d02273db5f98c934335aa67a9"
          test "$(git hash-object src/worker/routes.js)" = "66d523d012b4cf01e1a4ef63d3a0f494ac2b8537"
      - name: Replace transfer artifacts with source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .handoff/assets.js.gz .handoff/routes.js.gz .github/workflows/materialize-source.yml
          git add src/web/assets.js src/worker/routes.js
          git commit -m "build: materialize canonical handoff source"
          git push origin HEAD:feat/initial-mvp
